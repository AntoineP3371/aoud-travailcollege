<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Défis de l'équipage · Travail collège Gianni</title>
<meta name="theme-color" content="#0b2a4a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%E2%9A%93%3C/text%3E%3C/svg%3E">
<style>
:root {
  --sea: #0b2a4a; --sea2: #14507d; --sand: #f6e7c1; --sand2: #ecd49b; --wood: #3b2a14; --gold: #e0a526; --gold-d: #a8740c;
  --red: #b3261e; --green: #1e7a4a; --ink: #12304f; --muted: #6b5a3c;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color: var(--wood); background: linear-gradient(180deg, var(--sea) 0%, var(--sea2) 100%) fixed; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 720px; margin: 0 auto; padding: 12px 14px 40px; padding-top: max(12px, env(safe-area-inset-top)); }
header { display: flex; align-items: center; gap: 10px; color: #fff; margin-bottom: 12px; }
header .logo { width: 44px; height: 44px; flex: none; }
header h1 { margin: 0; font-size: 20px; line-height: 1.1; letter-spacing: 0.02em; flex: 1; }
header h1 small { display: block; font-size: 12px; font-weight: 400; opacity: 0.8; letter-spacing: 0; }
.pill { background: rgba(255,255,255,0.14); color: #fff; border: 1.5px solid rgba(255,255,255,0.45); border-radius: 999px; padding: 0 14px; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; text-decoration: none; }
.card { background: var(--sand); border: 3px solid var(--gold-d); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 0 rgba(0,0,0,0.25), inset 0 0 0 2px var(--sand2); }
.card h2 { margin: 0 0 8px; font-size: 18px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.rank { display: flex; align-items: center; gap: 12px; }
.rank .em { font-size: 40px; line-height: 1; }
.rank b { font-size: 20px; }
.bar { height: 12px; border-radius: 8px; background: rgba(59,42,20,0.18); overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #f4cb55); border-radius: 8px; transition: width 0.4s; }
.week { display: flex; gap: 6px; margin-top: 10px; }
.week span { flex: 1; text-align: center; border-radius: 10px; padding: 6px 0 4px; background: rgba(59,42,20,0.1); font-size: 12px; font-weight: 700; }
.week span.on { background: var(--gold); color: var(--wood); }
.week span.today { outline: 3px solid var(--sea2); }
.week span em { display: block; font-style: normal; font-size: 18px; }
.btn { display: block; width: 100%; min-height: 60px; border: 3px solid var(--wood); border-radius: 14px; background: #fff7dd; font-weight: 800; font-size: 18px; text-align: left; padding: 10px 14px; box-shadow: 0 4px 0 var(--wood); margin-bottom: 12px; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood); }
.btn small { display: block; font-weight: 500; font-size: 13px; color: var(--muted); }
.btn.star { background: linear-gradient(180deg, #ffe48a, var(--gold)); }
.btn.go { background: var(--sea2); color: #fff; border-color: var(--sea); box-shadow: 0 4px 0 var(--sea); text-align: center; }
.btn.go small { color: #dbeaf7; }
.tag { display: inline-block; background: var(--red); color: #fff; font-size: 12px; border-radius: 999px; padding: 2px 10px; margin-left: 8px; vertical-align: middle; }
.crew { font-style: italic; color: var(--muted); margin: 0 0 4px; }
/* jeu */
.top { display: flex; align-items: center; gap: 10px; color: #fff; margin-bottom: 10px; }
.top .dots { flex: 1; display: flex; gap: 6px; }
.dots i { flex: 1; height: 10px; border-radius: 6px; background: rgba(255,255,255,0.25); }
.dots i.ok { background: #5fd38d; } .dots i.ko { background: #ff8a80; } .dots i.cur { background: #fff; }
.timer { height: 14px; border-radius: 8px; background: rgba(255,255,255,0.22); overflow: hidden; margin-bottom: 12px; }
.timer > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #f4cb55, var(--gold)); transform-origin: left; }
.timer.low > i { background: #ff8a80; }
.q { font-size: 21px; line-height: 1.35; font-weight: 700; margin: 4px 0 14px; }
.tagline { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.opt { display: flex; gap: 10px; align-items: center; width: 100%; min-height: 58px; text-align: left; background: #fff7dd; border: 2.5px solid var(--wood); border-radius: 12px; padding: 8px 12px; margin-bottom: 10px; font-size: 17px; font-weight: 600; }
.opt b { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--wood); color: var(--sand); display: grid; place-items: center; font-size: 15px; }
.opt.right { background: #c9f0d9; border-color: var(--green); }
.opt.wrong { background: #ffd2cd; border-color: var(--red); }
.opt:disabled { cursor: default; }
.tf { display: flex; gap: 12px; }
.tf .btn { text-align: center; margin: 0; font-size: 22px; min-height: 70px; }
.fb { border-radius: 12px; padding: 12px 14px; margin-top: 4px; font-size: 16px; line-height: 1.4; }
.fb.good { background: #c9f0d9; border: 2px solid var(--green); }
.fb.bad { background: #ffe3df; border: 2px solid var(--red); }
.fb b.t { display: block; font-size: 18px; margin-bottom: 2px; }
.next { margin-top: 12px; }
.proposal { background: #fff; border: 2.5px dashed var(--gold-d); border-radius: 12px; padding: 12px; margin-bottom: 14px; font-size: 19px; font-weight: 700; }
.answer { background: #fff; border: 2.5px solid var(--green); border-radius: 12px; padding: 12px; margin-bottom: 12px; font-size: 18px; }
/* résultat */
.big { font-size: 56px; text-align: center; line-height: 1.1; margin: 4px 0; }
.res { text-align: center; }
.res h2 { font-size: 24px; }
.gain { font-size: 28px; font-weight: 800; color: var(--gold-d); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; }
.chip { background: #fff; border: 2px solid var(--gold-d); border-radius: 12px; padding: 8px 12px; font-weight: 700; }
.pop { animation: pop 0.5s ease-out; }
@keyframes pop { 0% { transform: scale(0.4); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } .bar > i, .timer > i { transition: none; } }
/* séance, pause, coffre */
.btn.big { min-height: 78px; font-size: 21px; }
.hero2 { text-align: center; }
.hero2 .tag { margin-left: 8px; }
.tabs { display: flex; gap: 4px; margin: 14px 0 0; }
.tabs button { flex: 1; min-height: 46px; border: 0; border-radius: 12px 12px 0 0; background: rgba(255,255,255,0.15); color: #fff; font-weight: 800; font-size: 13px; padding: 4px 2px; line-height: 1.15; }
.tabs button.on { background: var(--sand); color: var(--wood); box-shadow: inset 0 3px 0 var(--gold); }
.tabs button span { display: block; font-size: 18px; }
.tabpane { background: var(--sand); border: 3px solid var(--gold-d); border-top: 0; border-radius: 0 0 14px 14px; padding: 12px 10px 4px; margin-bottom: 14px; box-shadow: 0 4px 0 rgba(0,0,0,0.25); }
.tabpane .btn:last-child { margin-bottom: 8px; }
.famnote { background: #d9f0e1; border: 2px solid var(--green); border-radius: 12px; padding: 8px 12px; margin: 0 0 12px; font-size: 14px; color: #0f4a2c; }
.vstep { display: flex; gap: 10px; align-items: stretch; }
.vstep .l { width: 38px; display: flex; flex-direction: column; align-items: center; flex: none; }
.vstep .l b { width: 34px; height: 34px; border-radius: 50%; background: var(--sand); border: 3px solid var(--gold-d); display: flex; align-items: center; justify-content: center; font-size: 15px; flex: none; }
.vstep .l b.cur { background: var(--gold); border-color: var(--wood); }
.vstep .l b.d { background: var(--green); border-color: #0f4a2c; color: #fff; }
.vstep .l u { flex: 1; width: 4px; background: repeating-linear-gradient(rgba(255,255,255,0.55) 0 6px, transparent 6px 11px); margin: 3px 0; }
.vstep .c { flex: 1; padding-bottom: 12px; }
.vstep .c .btn { cursor: default; margin: 0; }
.vstep.done .c .btn { opacity: 0.72; }
.sub-h { color: #fff; opacity: 0.85; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin: 16px 2px 8px; }
.status { color: #fff; text-align: center; font-weight: 700; margin: -2px 0 10px; min-height: 24px; }
.status.hot { color: #f4cb55; font-size: 19px; }
.pause { background: #e3f4e8; border-color: var(--green); box-shadow: none; margin: 12px 0; text-align: center; }
.pause .count { font-size: 64px; font-weight: 800; color: var(--green); line-height: 1; margin: 6px 0; }
.pause .bar > i { background: var(--green); }
.rw { display: flex; align-items: center; gap: 12px; background: #fff7dd; border: 2.5px solid var(--wood); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; text-align: left; }
.rw .em { font-size: 34px; line-height: 1; flex: none; }
.rw .tx { flex: 1; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.rw small { display: block; font-weight: 500; color: var(--muted); }
.rw .btn { width: auto; margin: 0; min-height: 48px; padding: 6px 14px; font-size: 16px; text-align: center; flex: none; }
.rw.lock { opacity: 0.8; background: rgba(255,247,221,0.6); }
.rw .btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
.hist { font-size: 15px; margin: 4px 0; }
/* jeux d'échauffement et chasse à l'erreur */
.sentence { font-size: 20px; line-height: 1.75; margin: 8px 0 14px; }
.tok { display: inline-block; padding: 5px 7px; margin: 2px 1px; border-radius: 8px; border: 2px solid transparent; background: transparent; font: inherit; font-size: 20px; line-height: 1.3; color: inherit; cursor: pointer; }
.tok.glue { margin-left: -4px; }
.tok:active { background: rgba(224,165,38,0.35); }
.tok.ok { background: #c9f0d9; border-color: var(--green); }
.tok.ko { background: #ffd2cd; border-color: var(--red); }
.tok:disabled { cursor: default; }
mark.err { background: #ffd2cd; border-radius: 4px; padding: 0 3px; font-weight: 700; }
.stim { display: grid; place-items: center; width: 100%; min-height: 260px; border: 3px solid var(--wood); border-radius: 18px; background: #fff7dd; font-size: 120px; line-height: 1; margin-bottom: 12px; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.stim.hit { background: #c9f0d9; } .stim.bad { background: #ffd2cd; }
.gridz { display: grid; gap: 8px; margin: 8px 0; }
.cellz { display: grid; place-items: center; min-height: 48px; aspect-ratio: 1; background: #fff7dd; border: 2.5px solid var(--wood); border-radius: 12px; font-weight: 700; color: var(--wood); padding: 0; }
.cellz.ko { background: #ffd2cd; border-color: var(--red); } .cellz.ok { background: #c9f0d9; border-color: var(--green); }
.pads { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0 14px; }
.pad { min-height: 120px; border-radius: 18px; border: 4px solid rgba(0,0,0,0.35); font-size: 34px; color: rgba(255,255,255,0.9); transition: filter 0.1s, transform 0.1s; }
.pad.lit { filter: brightness(1.6); transform: scale(1.04); box-shadow: 0 0 0 6px #fff; }
.pad:disabled { opacity: 0.55; }
.who { text-align: center; font-weight: 800; font-size: 21px; margin: 4px 0 10px; }
.top .who { margin: 0; color: #fff; flex: 1; text-align: left; }
.pbox { background: #fff; border: 2.5px dashed var(--gold-d); border-radius: 12px; padding: 10px 12px; margin: 10px 0; }
.tag.g { background: var(--green); }
.pill.sm { min-height: 40px; padding: 0 12px; }
/* trésors */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { background: #fff7dd; border: 2.5px solid var(--wood); border-radius: 12px; padding: 10px 8px; text-align: center; min-height: 118px; }
.tile .em { font-size: 36px; line-height: 1.1; }
.tile b { display: block; font-size: 14px; margin-top: 4px; }
.tile small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.tile.lock { opacity: 0.55; background: rgba(255,247,221,0.6); border-style: dashed; }
.tile.lock .em { filter: grayscale(1); }
dialog, .modal { position: fixed; inset: 0; background: rgba(5,20,40,0.6); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal[hidden] { display: none; }
.modal .card { width: min(420px, 100%); margin: 0; }
.modal input { width: 100%; font-size: 20px; min-height: 48px; border: 2.5px solid var(--wood); border-radius: 10px; padding: 0 12px; background: #fff; margin: 8px 0; }
.small { font-size: 13px; color: var(--muted); }
#ver { opacity: 0.7; font-size: 12px; color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="16" fill="none" stroke="#e0a526" stroke-width="6"/><circle cx="32" cy="32" r="5" fill="#e0a526"/><g stroke="#e0a526" stroke-width="5" stroke-linecap="round"><path d="M32 4v12M32 48v12M4 32h12M48 32h12M12 12l8 8M44 44l8 8M52 12l-8 8M20 44l-8 8"/></g></svg>
    <h1>Défis de l'équipage<small>Révise en petits coups de vent <span id="ver">v7.0</span></small></h1>

</div>

    <div class="row"><button class="btn go" type="submit" style="width:auto;margin:0;padding:10px 22px">Connexion</button><button class="btn" id="lg-x" type="button" style="width:auto;margin:0;padding:10px 22px">Annuler</button></div>
  </form>
</div>
<script>
(function () {
"use strict";
var PB = location.origin;
function $(s) { return document.querySelector(s); }

/* ---------- données du jeu ---------- */
var RANKS = [[0, "Mousse", "🧒"], [100, "Matelot", "⚓"], [300, "Gabier", "🪢"], [600, "Second", "🧭"], [1000, "Capitaine", "🏴‍☠️"], [2000, "Amiral de la flotte", "👑"]];

    var u = {}; [a.miss || {}, b.miss || {}].forEach(function (m) { for (var x in m) if (!u[x] || (m[x].t || 0) > (u[x].t || 0)) u[x] = m[x]; });

/* --- Chasse à l'erreur --- */
function boldSegs(e) { var m, out = [], re = /<b>([^<]{2,40})<\/b>/g; while ((m = re.exec(e))) out.push(m[1]); return out; }

var SEGS = null;

function stripArt(x) { var m = x.match(/^(le |la |les |l'|l’|un |une |des |du |de la |de l'|d'|de )(.+)$/i); return m ? [m[1], m[2]] : ["", x]; }

/* Mot de remplacement : une mauvaise réponse de la carte (écrite pour être crédible) quand le terme est court, ou un autre nombre du même cours. */
function isNum(x) { return /^[−\-–]?\d[\d\s.,]*\s?(ans|cm|mm|m|km|°C|%|siècles?)?$/.test(x.trim()); }

function pickRepl(c, orig, plain, before) {

  if (bo.length >= 2 && orig.split(/\s+/).length <= 3 && (o0.indexOf(bo) >= 0 || bo.indexOf(o0) >= 0)) {
    if (!A[0] && DETS.test(before.trim())) { /* déterminant devant : le genre risque de ne pas coller */ }

    txt.split(/\s+/).filter(Boolean).forEach(function (w) { toks.push({ t: w, err: isErr, sp: first ? (trail || /^\s/.test(txt)) : true }); first = false; }); if (txt.trim()) trail = /\s$/.test(txt); });

function huntStart(m) {
  if (!POOL.length) { app.innerHTML = '<div class="top"><button class="pill" type="button" data-go="home">← Retour</button></div><div class="card"><p>Les questions ne sont pas chargées. Vérifie la connexion puis réessaie.</p></div>'; return; }
  if (!SEGS) segIndex();
  var rounds = [], seen = {}, pool = shuffle(POOL).filter(function (c) { var k = plainText(c.e).slice(0, 60); if (seen[k]) return false; seen[k] = 1; return true; }), errs = 0, i, r;

/* ---------- coffre de récompenses (choisies par les parents) ---------- */

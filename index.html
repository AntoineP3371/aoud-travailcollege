<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>Révisions par matière</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600&display=swap">
<style>
/* Layout: one column of 640px, a lined-notebook flashcard in the middle, score top right, exercises PDF below. */
:root {
  --paper: #f5f7fc;
  --card: #ffffff;
  --line: #d9e2f4;
  --border: #d3dbed;
  --ink: #1b3a8a;
  --ink-soft: #4a5f9c;
  --fg: #17203a;
  --muted: #566282;
  --red: #c23a2b;
  --ok: #1d7448;
  --ok-bg: #e2f3ea;
  --bad: #ad2a22;
  --bad-bg: #fae6e3;
  --btn-fg: #ffffff;
  --ink-emc: #0e6b57;
  --ink-soft-emc: #3f8a78;
  --display: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --body: "Atkinson Hyperlegible", system-ui, "Segoe UI", "DejaVu Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1422; --card: #171d30; --line: #27314f; --border: #2c3655;
    --ink: #a3bcff; --ink-soft: #8598d0; --fg: #e8ecf7; --muted: #9ba6c6;
    --red: #ff9183; --ok: #72d6a0; --ok-bg: #12301f; --bad: #ff9088; --bad-bg: #381917;
    --btn-fg: #0f1422; --ink-emc: #7fd6bd; --ink-soft-emc: #6fb9a5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1422; --card: #171d30; --line: #27314f; --border: #2c3655;
  --ink: #a3bcff; --ink-soft: #8598d0; --fg: #e8ecf7; --muted: #9ba6c6;
  --red: #ff9183; --ok: #72d6a0; --ok-bg: #12301f; --bad: #ff9088; --bad-bg: #381917;
  --btn-fg: #0f1422; --ink-emc: #7fd6bd; --ink-soft-emc: #6fb9a5;
  color-scheme: dark;
}
.wrap[data-subject="emc"] { --ink: var(--ink-emc); --ink-soft: var(--ink-soft-emc); }
* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 24px 48px;
}
.wrap { max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
sub { font-size: 0.72em; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.subjects { display: flex; gap: 22px; border-bottom: 2px solid var(--border); }
.subjects button { background: none; border: 0; border-bottom: 4px solid transparent; margin-bottom: -2px; padding: 10px 2px; min-height: 48px; font-weight: 700; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.subjects button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; }
.top > div { min-width: 0; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 46px; line-height: 1.05; color: var(--ink); text-wrap: balance; }
.lede { margin: 4px 0 0; color: var(--muted); }
.score { display: flex; align-items: baseline; gap: 6px; font-family: var(--display); color: var(--red); }
.score .n { font-size: 54px; line-height: 1; font-variant-numeric: tabular-nums; }
.score .of { font-size: 26px; font-variant-numeric: tabular-nums; }
.score .lab { font-family: var(--body); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-left: 4px; }

.controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 9px 14px; color: var(--ink); font-weight: 700; font-size: 14px; min-height: 44px; }
.seg button + button { border-left: 1.5px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--btn-fg); }
.chk { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); min-height: 44px; }
.chk input { width: 18px; height: 18px; accent-color: var(--ink); }

.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: transparent; background: var(--card); }
.dot.cur { border-color: var(--ink); border-width: 2.5px; }
.dot.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.dot.ko { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }

.card { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 20px 18px 20px 52px; box-shadow: 0 1px 0 var(--border); }
.card::before { content: ""; position: absolute; top: 0; bottom: 0; left: 36px; width: 2px; background: var(--red); opacity: 0.55; }
.meta { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; }
.meta .tag { color: var(--ink); }
.meta .cnt { color: var(--muted); font-variant-numeric: tabular-nums; }
.qtext { margin: 0 0 16px; font-size: 19px; line-height: 28px; font-weight: 700; color: var(--ink); background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, var(--line) 27px, var(--line) 28px); min-height: 56px; text-wrap: pretty; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: var(--card); border: 1.5px solid var(--border); border-radius: 8px; padding: 11px 14px; min-height: 48px; color: var(--fg); }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink); color: var(--ink); display: grid; place-items: center; font-size: 13px; font-weight: 700; margin-top: 1px; }
.opt .t { min-width: 0; overflow-wrap: anywhere; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt:disabled { cursor: default; color: var(--fg); }
.opt.ok { background: var(--ok-bg); border-color: var(--ok); }
.opt.ok .k { background: var(--ok); border-color: var(--ok); color: var(--card); }
.opt.ko { background: var(--bad-bg); border-color: var(--bad); }
.opt.ko .k { background: var(--bad); border-color: var(--bad); color: var(--card); }
.opt.dim { opacity: 0.6; }

.fix { margin-top: 16px; padding: 12px 14px; border: 1.5px dashed var(--red); border-radius: 8px; }
.fix .lab { font-family: var(--display); font-size: 26px; line-height: 1; color: var(--red); display: block; margin-bottom: 4px; }
.fix .verdict { font-weight: 700; }
.fix p { margin: 0; }
.fix p + p { margin-top: 6px; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.btn { background: var(--ink); color: var(--btn-fg); border: 1.5px solid var(--ink); border-radius: 8px; padding: 11px 18px; font-weight: 700; min-height: 48px; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.good { background: var(--ok); border-color: var(--ok); color: var(--card); }
.btn.again { background: var(--bad); border-color: var(--bad); color: var(--card); }
.btn:hover { filter: brightness(1.08); }
.hint { margin: 10px 0 0; font-size: 13px; color: var(--muted); }

.results { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 22px 18px 22px 52px; position: relative; }
.results::before { content: ""; position: absolute; top: 0; bottom: 0; left: 36px; width: 2px; background: var(--red); opacity: 0.55; }
.results h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 28px; color: var(--ink); }
.bigscore { font-family: var(--display); color: var(--red); font-size: 76px; line-height: 1; margin: 6px 0; font-variant-numeric: tabular-nums; }
.bigscore span { font-size: 38px; }
.results p { margin: 0 0 6px; }
.missed { margin: 16px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.missed li { border-top: 1px solid var(--border); padding-top: 10px; }
.missed .mq { font-weight: 700; color: var(--ink); }
.missed .ma { color: var(--muted); font-size: 15px; }

.exo { border-top: 1.5px solid var(--ink); padding-top: 18px; display: flex; flex-direction: column; gap: 8px; }
.exo h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 30px; color: var(--ink); }
.exo p { margin: 0; color: var(--muted); }
.exo .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 6px; }
#dlmsg { font-size: 14px; color: var(--muted); }

@media (max-width: 480px) {
  h1 { font-size: 38px; }
  .card, .results { padding-left: 44px; padding-right: 14px; }
  .card::before, .results::before { left: 30px; }
}
@media (prefers-reduced-motion: no-preference) {
  .opt, .dot, .btn { transition: background-color .15s, border-color .15s; }
}
</style>

</head>
<body>
<div class="wrap" id="wrap" data-subject="maths">
  <nav class="subjects" role="tablist" aria-label="Matières">
    <button type="button" role="tab" id="t-maths" aria-selected="true">Mathématiques</button>
    <button type="button" role="tab" id="t-emc" aria-selected="false">EMC</button>
  </nav>
  <header class="top">
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="h1"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="score" aria-live="polite" aria-label="Score">
      <span class="n" id="pts">0</span><span class="of">/ <span id="tot">15</span></span><span class="lab">points</span>
    </div>
  </header>

  <div class="controls">
    <div class="seg" role="group" aria-label="Mode de révision">
      <button type="button" id="m-qcm" aria-pressed="true">QCM corrigé</button>
      <button type="button" id="m-flip" aria-pressed="false">Carte à retourner</button>
    </div>
    <label class="chk" for="shuffle"><input type="checkbox" id="shuffle"> Ordre aléatoire</label>
  </div>

  <div class="dots" id="dots" aria-hidden="true"></div>

  <main class="card" id="stage"></main>

  <section class="results" id="results" hidden></section>

  <section class="exo" aria-labelledby="exo-title">
    <h2 id="exo-title">Exercices à imprimer</h2>
    <p id="exo-desc"></p>
    <div class="row">
      <button type="button" class="btn" id="dl">Télécharger le PDF</button>
      <span id="dlmsg" role="status"></span>
    </div>
  </section>
</div>

  { tag: "CVC", q: "Qu'est-ce que le <b>CVC</b> (Conseil de la Vie Collégienne) ?",
    o: ["Une instance où des adultes et des élèves élus discutent et proposent des actions pour améliorer la vie des collégiens", "Un conseil qui décide des notes et des passages de classe", "Une association qui organise les voyages scolaires", "Un jury qui recrute les professeurs"],
    e: "Le CVC est une instance où des <b>adultes et des élèves élus</b> discutent et peuvent proposer des actions pour améliorer la vie des collégiens." },
  { tag: "Éco-délégué", q: "Quelle est la mission d'un <b>éco-délégué</b> ?",
    o: ["Mettre en place des actions en faveur de l'environnement", "Représenter sa classe au conseil de classe", "Gérer le foyer du collège", "Surveiller la cantine pour le professeur"],
    e: "Un éco-délégué est un élève élu pour mettre en place des <b>actions en faveur de l'environnement</b>. Représenter la classe au conseil de classe, c'est le rôle du délégué de classe." },
  { tag: "FSE", q: "Qu'est-ce que le <b>FSE</b> (Foyer Socio-Éducatif) dans un collège ?",
    o: ["Une association qui permet aux élèves, aux personnels et aux familles d'organiser des actions éducatives et ludiques", "Un syndicat d'enseignants", "Un conseil qui vote le règlement intérieur", "Un service qui gère la cantine"],
    e: "Le FSE est une <b>association</b> du collège qui permet aux élèves, aux personnels et aux familles d'organiser des actions pédagogiques, éducatives, ludiques…" },
  { tag: "Majorité absolue", q: "Qu'est-ce que la <b>majorité absolue</b> lors d'une élection ?",
    o: ["Obtenir la moitié des voix + une voix", "Obtenir le plus de voix, même sans atteindre la moitié", "Obtenir toutes les voix", "Obtenir exactement la moitié des voix"],
    e: "La majorité absolue, c'est obtenir <b>la moitié des voix + une voix</b>." },
  { tag: "Majorité relative", q: "Qu'est-ce que la <b>majorité relative</b> lors d'une élection ?",
    o: ["Obtenir le plus de voix", "Obtenir la moitié des voix + une voix", "Obtenir au moins deux tiers des voix", "Être le candidat le plus âgé"],
    e: "La majorité relative, c'est obtenir <b>le plus de voix</b>, sans avoir besoin de dépasser la moitié." },
  { tag: "Électeur", q: "Que veut dire être « <b>électeur</b> » ?",
    o: ["Avoir le droit de voter, de choisir ses représentants", "Avoir le droit de se présenter à l'élection", "Avoir été élu", "Organiser le vote"],
    e: "Un électeur est celui qui a <b>le droit de voter</b> et de choisir ses représentants." },
  { tag: "Éligible", q: "Que veut dire être « <b>éligible</b> » ?",
    o: ["Avoir le droit de se présenter à une élection : on peut être élu", "Avoir le droit de voter", "Avoir déjà été élu", "Dépouiller les bulletins de vote"],
    e: "Une personne éligible a le droit de <b>se présenter</b> à une élection : elle peut être élue." },
  { tag: "Liberté de conscience", q: "Que veut dire la <b>liberté de conscience</b> ?",
    o: ["Le droit de penser ce que l'on veut, mais aussi de croire ou de ne pas croire", "Le droit de voter plusieurs fois", "Le droit de ne jamais obéir aux lois", "Le droit de se présenter à toutes les élections"],
    e: "C'est le droit de <b>penser ce que l'on veut</b>, mais aussi de croire ou de ne pas croire." },
  { tag: "Intérêt général", q: "Que désigne l'<b>intérêt général</b> ?",
    o: ["Ce qui est bon pour l'ensemble des citoyens, ce qui profite à un maximum de personnes", "Ce qui ne profite qu'à soi ou à un petit nombre de personnes", "Ce que décide le plus âgé des élus", "Ce qui plaît seulement aux élus"],
    e: "L'intérêt général désigne ce qui est <b>bon pour l'ensemble des citoyens</b>, ce qui profite à un maximum de personnes." },
  { tag: "Intérêt particulier", q: "Que désigne l'<b>intérêt particulier</b> ?",
    o: ["Ce qui ne profite qu'à soi ou à un petit nombre de personnes", "Ce qui est bon pour l'ensemble des citoyens", "Ce qui est interdit par la loi", "Ce qui concerne uniquement les enfants"],
    e: "L'intérêt particulier désigne ce qui <b>ne profite qu'à soi</b> ou à un petit nombre de personnes." },
  { tag: "Délégués de classe", q: "Comment les <b>délégués de classe</b> sont-ils élus ?",
    o: ["Au scrutin uninominal à deux tours : tous les élèves de la classe sont électeurs et éligibles", "Ils sont désignés par le professeur principal", "Ils sont tirés au sort dans la classe", "Seuls les délégués de l'an dernier votent"],
    e: "Deux délégués sont élus par classe, chacun avec son suppléant. Le scrutin est <b>uninominal</b> : chaque électeur choisit un candidat (et non une liste). Tous les élèves sont électeurs et éligibles, et les candidatures sont individuelles." },
  { tag: "Délégués de classe", q: "Quel est le rôle du <b>délégué de classe</b> ?",
    o: ["Représenter les élèves de sa classe et agir pour l'ensemble de la classe, par exemple au conseil de classe", "Faire respecter la discipline à la place des professeurs", "Corriger les devoirs de ses camarades", "Choisir les sujets des contrôles"],
    e: "Les délégués <b>représentent</b> les élèves de leur classe et agissent pour l'ensemble de la classe : ils transmettent la parole de leurs camarades, par exemple lors du conseil de classe." },
  { tag: "Élection", q: "Que faut-il pour être élu délégué au <b>1<sup>er</sup> tour</b> ?",
    o: ["La majorité absolue : la moitié des voix + une voix", "La majorité relative : le plus de voix", "Être le plus jeune des candidats", "Avoir l'accord du professeur principal"],
    e: "Au 1<sup>er</sup> tour, il faut la <b>majorité absolue</b> : avoir obtenu la moitié des voix + une voix." },
  { tag: "Élection", q: "Que faut-il pour être élu au <b>2<sup>e</sup> tour</b> ? Et en cas d'égalité des voix ?",
    o: ["La majorité relative (le plus de voix) ; en cas d'égalité, le plus jeune est élu", "La majorité absolue ; en cas d'égalité, le plus âgé est élu", "La majorité relative ; en cas d'égalité, on tire au sort", "La majorité absolue ; en cas d'égalité, on refait un 3<sup>e</sup> tour"],
    e: "Au 2<sup>e</sup> tour, il faut la <b>majorité relative</b> : celui qui a le plus de voix l'emporte. En cas d'égalité, c'est <b>le candidat le plus jeune</b> qui est élu." },
  { tag: "Vote", q: "Pourquoi vote-t-on à <b>bulletin secret</b>, dans l'isoloir ?",
    o: ["Pour choisir librement, sans pression : c'est la liberté de conscience", "Pour que personne ne sache qui est candidat", "Pour pouvoir voter plusieurs fois sans être vu", "Pour que le résultat reste inconnu"],
    e: "On vote dans l'isoloir pour <b>choisir librement</b>, sans pression : c'est ce qu'on appelle la liberté de conscience." },
  { tag: "Vote", q: "À quoi sert de <b>voter</b> ?",
    o: ["À élire les dirigeants politiques qui nous représentent", "À désigner la personne la plus âgée de la commune", "À changer le nom de la commune", "À payer ses impôts"],
    e: "Voter sert à <b>élire les dirigeants politiques</b>. C'est un droit que des gens se sont battus pour obtenir, et un moyen de donner son avis." },
  { tag: "Représenter", q: "Que signifie « <b>représenter les autres</b> » quand on est élu ?",
    o: ["Prendre des responsabilités : décider pour le bien de tous et rendre des comptes à ceux qui nous ont élus", "Décider seul sans écouter personne", "Faire passer ses propres envies avant celles des autres", "Obtenir des avantages pour ses amis"],
    e: "Représenter les autres, c'est <b>prendre des responsabilités</b>. Les élus ont le devoir de prendre des décisions pour le bien de tous et de rendre des comptes aux citoyens qui les ont élus." },
  { tag: "Représenter", q: "Les citoyens français peuvent être représentés à <b>différentes échelles</b>. Lesquelles ?",
    o: ["Par exemple dans leur commune (mairie) et dans leur département (conseillers départementaux)", "Uniquement à l'échelle du pays", "Uniquement dans leur quartier", "Uniquement au niveau de l'Europe"],
    e: "Les Français sont représentés à <b>différents niveaux</b> : par exemple par le maire et le conseil municipal dans leur commune, par les conseillers départementaux dans leur département. À chaque échelle, les décisions répondent à un besoin collectif." },
  { tag: "Intérêt général", q: "Dans une démocratie, que doit faire passer un élu en premier ?",
    o: ["L'intérêt général avant l'intérêt particulier", "L'intérêt particulier avant l'intérêt général", "Son propre intérêt, puis celui de ses amis", "Aucun des deux : il décide au hasard"],
    e: "Il faut accepter de faire passer l'<b>intérêt général</b> (ce qui est bénéfique à une majorité de personnes) avant l'<b>intérêt particulier</b>. Les décisions sont prises après des débats qui cherchent ce qui peut être utile à tous." }
];

var SUBJECTS = {
  maths: { eyebrow: "Mathématiques · Séquence 2", title: "Droites et segments", sub: "Droite, demi-droite, segment",
           cards: MATHS, pdf: PDF_MATHS, file: "exercices_sequence2_droites.pdf",
           exo: "8 exercices sur 3 pages : vocabulaire, notations, vrai ou faux, appartenance, propriétés, milieu et constructions à l'équerre." },
  emc: { eyebrow: "EMC · Enfant et déjà apprenti citoyen", title: "Représenter les autres", sub: "Délégués, élections et intérêt général",
         cards: EMC, pdf: PDF_EMC, file: "exercices_emc_representer_les_autres.pdf",
         exo: "7 exercices sur 3 pages : lexique, missions des élus, vrai ou faux, élection du délégué, intérêt général et production écrite." }
};
var subject = "maths";
var Q = MATHS;

var $ = function (s) { return document.querySelector(s); };
var mode = "qcm";
var run = null;
var LETTERS = ["A", "B", "C", "D"];

function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function startRun(ids) {
  run = { ids: ids, pos: 0, pts: 0, res: ids.map(function () { return null; }),
          opts: null, chosen: null, flipped: false, full: ids.length === Q.length };
  $("#results").hidden = true;
  $("#stage").hidden = false;
  renderAll();
}

function newRun() {
  var ids = Q.map(function (_, i) { return i; });
  if ($("#shuffle").checked) shuffle(ids);
  startRun(ids);
}

function renderAll() {
  $("#pts").textContent = run.pts;
  $("#tot").textContent = run.ids.length;
  var dots = "";
  for (var i = 0; i < run.ids.length; i++) {
    var c = "dot";
    var g = "";
    if (run.res[i] === true) { c += " ok"; g = "✓"; }
    else if (run.res[i] === false) { c += " ko"; g = "✗"; }
    else if (i === run.pos) { c += " cur"; }
    dots += '<span class="' + c + '">' + g + "</span>";
  }
  $("#dots").innerHTML = dots;
  renderCard();
}

function head(q) {
  return '<div class="meta"><span class="tag">' + q.tag + '</span><span class="cnt">Question ' + (run.pos + 1) + " sur " + run.ids.length + "</span></div>" +
         '<p class="qtext">' + q.q + "</p>";
}

function renderCard() {
  var q = Q[run.ids[run.pos]];
  var last = run.pos === run.ids.length - 1;
  var nextLabel = last ? "Voir mon score" : "Question suivante";
  var h = head(q);
  if (mode === "qcm") {
    if (!run.opts) run.opts = shuffle(q.o.map(function (t, i) { return { t: t, ok: i === 0 }; }));
    var answered = run.chosen !== null;
    h += '<div class="opts" role="group" aria-label="Réponses">';
    run.opts.forEach(function (o, k) {
      var c = "opt";
      var mark = LETTERS[k];
      if (answered) {
        if (o.ok) { c += " ok"; mark = "✓"; }
        else if (k === run.chosen) { c += " ko"; mark = "✗"; }
        else c += " dim";
      }
      h += '<button type="button" class="' + c + '" data-k="' + k + '"' + (answered ? " disabled" : "") + '><span class="k">' + mark + '</span><span class="t">' + o.t + "</span></button>";
    });
    h += "</div>";
    if (answered) {
      var ok = run.opts[run.chosen].ok;
      h += '<div class="fix" role="status"><span class="lab">Correction</span><p class="verdict">' + (ok ? "Juste, +1 point." : "Raté, 0 point.") + "</p><p>" + q.e + "</p></div>";
      h += '<div class="actions"><button type="button" class="btn" id="next">' + nextLabel + "</button></div>";
    } else {
      h += '<p class="hint">Touches 1 à 4 du clavier pour répondre.</p>';
    }
  } else {
    if (!run.flipped) {
      h += '<div class="actions"><button type="button" class="btn" id="flip">Retourner la carte</button></div>';
      h += '<p class="hint">Réponds dans ta tête, retourne la carte, puis note-toi honnêtement.</p>';
    } else if (run.res[run.pos] === null) {
      h += '<div class="fix" role="status"><span class="lab">Réponse</span><p>' + q.e + "</p></div>";
      h += '<div class="actions"><button type="button" class="btn good" id="knew">Je savais (+1)</button><button type="button" class="btn again" id="redo">À revoir</button></div>';
    } else {
      h += '<div class="fix" role="status"><span class="lab">Réponse</span><p>' + q.e + "</p></div>";
      h += '<div class="actions"><button type="button" class="btn" id="next">' + nextLabel + "</button></div>";
    }
  }
  $("#stage").innerHTML = h;
  var n = $("#next"); if (n) n.focus();
}

function choose(k) {
  if (!run || mode !== "qcm" || run.chosen !== null || !run.opts || $("#stage").hidden) return;
  if (k < 0 || k >= run.opts.length) return;
  run.chosen = k;
  var ok = run.opts[k].ok;
  run.res[run.pos] = ok;
  if (ok) run.pts++;
  renderAll();
}

function grade(ok) {
  if (run.res[run.pos] !== null) return;
  run.res[run.pos] = ok;
  if (ok) run.pts++;
  renderAll();
}

function nextQ() {
  run.pos++;
  run.opts = null; run.chosen = null; run.flipped = false;
  if (run.pos >= run.ids.length) finish(); else renderAll();
}

function getBest() { try { return parseInt(localStorage.getItem("best-" + subject), 10) || 0; } catch (e) { return 0; } }
function setBest(v) { try { localStorage.setItem("best-" + subject, String(v)); } catch (e) {} }

function finish() {
  var n = run.ids.length;
  $("#pts").textContent = run.pts;
  $("#stage").hidden = true;
  var missed = [];
  run.ids.forEach(function (id, i) { if (run.res[i] === false) missed.push(id); });
  var msg;
  var r = run.pts / n;
  if (r >= 0.93) msg = "Très bien, la séquence est acquise.";
  else if (r >= 0.66) msg = "Bien. Relis les cartes ratées, puis refais la série.";
  else if (r >= 0.4) msg = "À consolider : refais la série sur tes erreurs.";
  else msg = "Reprends la leçon, puis refais la série.";
  var best = "";
  if (run.full) {
    var prev = getBest();
    if (run.pts > prev) { setBest(run.pts); best = "Nouveau meilleur score sur cet appareil."; }
    else if (prev > 0) best = "Meilleur score sur cet appareil : " + prev + " / " + Q.length + ".";
  }
  var h = "<h2>Série terminée</h2>" +
    '<div class="bigscore">' + run.pts + "<span> / " + n + "</span></div>" +
    "<p><b>" + msg + "</b></p>" + (best ? "<p>" + best + "</p>" : "");
  if (missed.length) {
    h += '<ul class="missed">';
    missed.forEach(function (id) {
      h += '<li><div class="mq">' + Q[id].q + '</div><div class="ma">' + Q[id].e + "</div></li>";
    });
    h += "</ul>";
  }
  h += '<div class="actions">';
  if (missed.length) h += '<button type="button" class="btn" id="redoMissed">Refaire mes erreurs (' + missed.length + ")</button>";
  h += '<button type="button" class="btn ghost" id="restart">Recommencer la série</button></div>';
  var el = $("#results");
  el.innerHTML = h;
  el.hidden = false;
  run.missed = missed;
  var f = $("#redoMissed") || $("#restart");
  if (f) f.focus();
}

function setMode(m) {
  mode = m;
  $("#m-qcm").setAttribute("aria-pressed", String(m === "qcm"));
  $("#m-flip").setAttribute("aria-pressed", String(m === "flip"));
  newRun();
}

document.addEventListener("click", function (ev) {
  var t = ev.target.closest("button");
  if (!t || !run) return;
  if (t.classList.contains("opt")) choose(parseInt(t.getAttribute("data-k"), 10));
  else if (t.id === "next") nextQ();
  else if (t.id === "flip") { run.flipped = true; renderCard(); }
  else if (t.id === "knew") grade(true);
  else if (t.id === "redo") grade(false);
  else if (t.id === "restart") { $("#shuffle").checked = true; newRun(); }
  else if (t.id === "redoMissed") { startRun(shuffle(run.missed.slice())); }
});
$("#m-qcm").addEventListener("click", function () { setMode("qcm"); });
$("#m-flip").addEventListener("click", function () { setMode("flip"); });
$("#shuffle").addEventListener("change", newRun);
document.addEventListener("keydown", function (ev) {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  var k = "1234".indexOf(ev.key);
  if (k >= 0) choose(k);
});

/* --- Téléchargement du PDF des exercices --- */
function pdfBlob() {
  var bin = atob(SUBJECTS[subject].pdf);
  var arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: "application/pdf" });
}
function dlMsg(t) { $("#dlmsg").textContent = t; }
function noDownload() {
  $("#dl").hidden = true;
  dlMsg("Le téléchargement n'est pas disponible dans cet affichage.");
}
function localDownload() {
  var u = URL.createObjectURL(pdfBlob());
  var a = document.createElement("a");
  a.href = u; a.download = SUBJECTS[subject].file;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
  dlMsg("Fichier téléchargé.");
}
$("#dl").addEventListener("click", function () {
  if (!window.claude || !window.claude.use) { if (STANDALONE) localDownload(); else noDownload(); return; }
  window.claude.use("downloads").then(function (dl) {
    if (!dl) { noDownload(); return null; }
    return dl.save({ filename: SUBJECTS[subject].file, data: pdfBlob() }).then(function () {
      dlMsg("Fichier enregistré.");
    }, function (e) {
      dlMsg(e && e.code === "declined" ? "Téléchargement annulé." : "Le téléchargement a échoué dans cet affichage.");
    });
  });
});
try {
  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(function (dl) { if (!dl) noDownload(); });
  }
} catch (e) {}

function setSubject(k) {
  subject = k;
  var S = SUBJECTS[k];
  Q = S.cards;
  $("#wrap").setAttribute("data-subject", k);
  $("#t-maths").setAttribute("aria-selected", String(k === "maths"));
  $("#t-emc").setAttribute("aria-selected", String(k === "emc"));
  $("#eyebrow").textContent = S.eyebrow;
  $("#h1").textContent = S.title;
  $("#lede").textContent = S.sub + " : " + Q.length + " cartes pour réviser.";
  $("#exo-desc").textContent = S.exo;
  dlMsg("");
  try { location.hash = k; } catch (e) {}
  newRun();
}
$("#t-maths").addEventListener("click", function () { setSubject("maths"); });
$("#t-emc").addEventListener("click", function () { setSubject("emc"); });

newRun();
(function () {
  var h = "";
  try { h = location.hash.replace("#", ""); } catch (e) {}
  setSubject(SUBJECTS[h] ? h : "maths");
})();
</script>
